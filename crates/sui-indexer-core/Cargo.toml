[package]
name = "sui-indexer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
description = "Core indexer library for Sui Indexer"
rust-version.workspace = true
keywords = ["sui", "indexer", "blockchain", "grpc", "web3"]
categories = ["cryptography::blockchain", "network-programming"]
readme = "../../README.md"

[dependencies]
# Workspace dependencies
sui-indexer-config = { path = "../sui-indexer-config" }
sui-indexer-events = { path = "../sui-indexer-events" }
sui-indexer-storage = { path = "../sui-indexer-storage" }

# Sui dependencies (moved from sui-indexer-sui)
sui-json-rpc-types.workspace = true
sui-rpc-api.workspace = true
sui-types.workspace = true

# Async runtime
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Error handling
eyre.workspace = true

# Tracing
bcs.workspace = true
tracing.workspace = true

# Backfill / concurrency / retry
futures.workspace = true
reqwest.workspace = true

# Query API
adapter-move = { version = "0.1.0", path = "../adapter-move" }
adapter-svm = { version = "0.1.0", path = "../adapter-svm" }
archive-store = { version = "0.1.0", path = "../archive-store" }
axum.workspace = true
chain-core = { version = "0.1.0", path = "../chain-core" }
job-engine = { version = "0.1.0", path = "../job-engine" }
rule-host = { version = "0.1.0", path = "../rule-host" }
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "json",
] }
tokio-stream.workspace = true

[dev-dependencies]

# Additional dependencies for examples
async-trait.workspace = true
chrono.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
wat = "1.258.0"

# Examples
[[example]]
name = "simple_indexer"
path = "../../examples/simple_indexer.rs"

[[example]]
name = "custom_defi_indexer"
path = "../../examples/custom_defi_indexer.rs"

[lints]
workspace = true
