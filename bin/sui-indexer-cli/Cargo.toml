[package]
name = "sui-indexer-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
description = "CLI interface for the Sui Indexer Framework"
rust-version.workspace = true
keywords = ["sui", "indexer", "cli", "blockchain", "web3"]
categories = ["cryptography::blockchain", "command-line-utilities"]
readme = "../../README.md"

[[bin]]
name = "sui-indexer"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
sui-indexer-config = { path = "../../crates/sui-indexer-config" }
sui-indexer-core = { path = "../../crates/sui-indexer-core" }

# CLI dependencies
clap.workspace = true
clap_complete.workspace = true
eyre.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sui-indexer-storage = { path = "../../crates/sui-indexer-storage" }
sui-types.workspace = true

# Async runtime
tokio.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[lints.clippy]
print_stdout = "allow"
print_stderr = "allow"
