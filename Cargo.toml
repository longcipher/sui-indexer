[workspace]
resolver = "3"
members = [
    "bin/sui-indexer-cli",
    "crates/sui-indexer-config",
    "crates/sui-indexer-core",
    "crates/sui-indexer-events",
    "crates/sui-indexer-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A high-performance, modular blockchain indexer for the Sui network"
repository = "https://github.com/longcipher/sui-indexer"
documentation = "https://docs.rs/sui-indexer"
readme = "README.md"
authors = ["longcipher <longcipher@gmail.com>"]
keywords = ["sui", "blockchain", "indexer", "web3", "postgres"]
categories = ["cryptography::blockchain", "database", "network-programming"]

[workspace.dependencies]
# Sui dependencies — pinned to the latest `main` rev for reproducible builds.
# When bumping the Sui SDK, update `rev` on ALL entries below to the same commit.
# Current rev: be15a10386e78f5fa8d6be365a0fd228b22fa0c5
sui-config = { git = "https://github.com/MystenLabs/sui.git", rev = "be15a10386e78f5fa8d6be365a0fd228b22fa0c5" }
sui-json-rpc-api = { git = "https://github.com/MystenLabs/sui.git", rev = "be15a10386e78f5fa8d6be365a0fd228b22fa0c5" }
sui-json-rpc-types = { git = "https://github.com/MystenLabs/sui.git", rev = "be15a10386e78f5fa8d6be365a0fd228b22fa0c5" }
sui-rpc-api = { git = "https://github.com/MystenLabs/sui.git", rev = "be15a10386e78f5fa8d6be365a0fd228b22fa0c5" }
sui-sdk = { git = "https://github.com/MystenLabs/sui.git", rev = "be15a10386e78f5fa8d6be365a0fd228b22fa0c5" }
sui-sdk-types = { git = "https://github.com/MystenLabs/sui.git", rev = "be15a10386e78f5fa8d6be365a0fd228b22fa0c5" }
sui-types = { git = "https://github.com/MystenLabs/sui.git", rev = "be15a10386e78f5fa8d6be365a0fd228b22fa0c5" }

# Async runtime
tokio = { version = "=1.52.1", features = ["full"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.6"

# Database
eyre = "0.6.14"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "migrate",
] }
thiserror = "2.0.20"

# CLI
clap = { version = "4.6.7", features = ["derive", "env", "color"] }

# Configuration
config = "0.15.25"

# Logging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Data structures
chrono = { version = "0.4.45", features = ["serde"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }

# Utilities
async-trait = "0.1.92"

# Development dependencies
tempfile = "3.27.0"

# ============================================================
# Workspace-wide lint configuration
# Each crate opts in via `[lints] workspace = true`.
# ============================================================
[workspace.lints.clippy]
# Forbid error-prone and debugging patterns.
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
# `unwrap`/`expect` are allowed at infallible-by-construction sites
# (e.g. parsing a hardcoded default URL). New code should prefer `?`.
unwrap_used = "allow"
expect_used = "allow"

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.rustdoc]
all = "warn"

# cargo-shear mis-classifies Sui git dependencies as unused because our crates
# consume them through re-exports and `pub mod` boundaries. They are required,
# so we exclude them from the unused-dependency check.
[workspace.metadata.cargo-shear]
ignored = [
    "sui-config",
    "sui-json-rpc-api",
    "sui-json-rpc-types",
    "sui-sdk",
    "sui-sdk-types",
]

[profile.bench]
debug = true

[profile.dev]
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
